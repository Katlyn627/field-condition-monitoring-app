<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2e4a3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TrailTracker" />
    <title>East Bay Field & Trail Condition Tracker</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='108' fill='%23173c34'/%3E%3Cpath d='M95 360h322l-66-94-58 64-48-74-80 104-36-50z' fill='%23dfeee4'/%3E%3Cpath d='M354 126c-40 9-70 46-70 88v20c0 15 12 27 27 27 62 0 112-50 112-112v-23c-22-5-45-5-69 0z' fill='%2374c69d'/%3E%3Ccircle cx='154' cy='156' r='28' fill='%23f3efe2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Register Service Worker with cache-busting query parameter
      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js?v=5').catch((error) => {
            console.error('Service worker registration failed:', error);
          });
        });
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-group">
          <svg class="brand-logo" viewBox="0 0 64 64" role="img" aria-label="TrailTracker logo">
            <rect x="2" y="2" width="60" height="60" rx="14" fill="#173c34"></rect>
            <path d="M12 45h40l-8-12-8 8-6-10-10 14-4-6z" fill="#dfeee4"></path>
            <path d="M44 12c-7 2-12 8-12 15v3c0 2.8 2.2 5 5 5 10.5 0 19-8.5 19-19v-4c-4-1-8-1-12 0z" fill="#74c69d"></path>
            <circle cx="19" cy="19" r="4" fill="#f3efe2"></circle>
          </svg>
          <p class="eyebrow">East Bay Regional Park Stewardship</p>
          <h1>Field & Trail Condition Tracker</h1>
        </div>
        <div class="header-actions">
          <div class="header-pill" id="offlineStatus" aria-live="polite">
            <span class="status-dot"></span>
            <span>Online</span>
          </div>
        </div>
      </header>

      <!-- Mobile Navigation Tabs -->
      <nav class="mobile-tabs" role="tablist">
        <button class="tab-button" data-tab="dashboard" role="tab" aria-selected="true" aria-controls="dashboard-panel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Dashboard</span>
        </button>
        <button class="tab-button" data-tab="form" role="tab" aria-selected="false" aria-controls="form-panel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8m3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5m-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11m3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"></path>
          </svg>
          <span>Log</span>
        </button>
        <button class="tab-button" data-tab="logs" role="tab" aria-selected="false" aria-controls="logs-panel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>History</span>
        </button>
      </nav>

      <!-- Dashboard Panel -->
      <div class="tab-panel" id="dashboard-panel" role="tabpanel" aria-labelledby="dashboard-tab">
        <section class="dashboard" aria-label="Incident dashboard">
          <article class="stat-card total">
            <span class="stat-label">Total Logged Incidents</span>
            <strong id="totalIncidents">0</strong>
          </article>
          <article class="stat-card pending">
            <span class="stat-label">Pending Work</span>
            <strong id="pendingWork">0</strong>
          </article>
          <article class="stat-card resolved">
            <span class="stat-label">Resolved Items</span>
            <strong id="resolvedItems">0</strong>
          </article>
          <article class="stat-card hours">
            <span class="stat-label">Volunteer Hours</span>
            <strong id="volunteerHours">0.0</strong>
          </article>
        </section>
        <div class="dashboard-actions">
          <button id="exportGpxButton" class="secondary-button" type="button">Export GPX File</button>
          <button id="importGpxButton" class="secondary-button" type="button">Import GPX / Trail Track</button>
          <input id="importGpxInput" type="file" accept=".gpx,.xml,application/gpx+xml,text/xml" hidden>
        </div>
      </div>

      <!-- Form Panel -->
      <div class="tab-panel" id="form-panel" role="tabpanel" aria-labelledby="form-tab" hidden>
        <main class="main-grid">
          <section class="panel form-panel form-container">
          <div class="section-heading">
            <h2>Log Field Incident</h2>
          </div>

          <form id="incidentForm">
            <div class="field-grid">
              <label>
                <span>Incident Type</span>
                <select id="incidentType" name="type" required>
                  <option value="Trail Hazard">Trail Hazard</option>
                  <option value="Invasive Species">Invasive Species</option>
                  <option value="Infrastructure/Trash">Infrastructure/Trash</option>
                  <option value="Wildlife Impact">Wildlife Impact</option>
                </select>
              </label>

              <label>
                <span>Location / Trailhead</span>
                <input id="location" name="location" type="text" placeholder="e.g., Sunset Trailhead, Tilden" />
              </label>

              <label>
                <span>Priority Level</span>
                <select id="priority" name="priority" required>
                  <option value="Low">Low</option>
                  <option value="Medium">Medium</option>
                  <option value="High">High</option>
                  <option value="Immediate Safety Hazard">Immediate Safety Hazard</option>
                </select>
              </label>

              <label>
                <span>Status</span>
                <select id="status" name="status" required>
                  <option value="Flagged">Flagged</option>
                  <option value="Pending Trail Match">Pending Trail Match</option>
                  <option value="Reported to District">Reported to District</option>
                  <option value="Resolved">Resolved</option>
                </select>
              </label>

              <label class="full-width check-row">
                <input id="pendingTrailMatch" name="pendingTrailMatch" type="checkbox" />
                <span>Offline / post-hike entry (mark as Pending Trail Match)</span>
              </label>

              <label>
                <span>GPS Coordinates</span>
                <div class="gps-row">
                  <input id="gps" name="gps" type="text" placeholder="37.8741,-122.2861" />
                  <button id="gpsLocationButton" type="button" class="secondary-button">Use Current Location</button>
                </div>
                <span id="gpsStatusBadge" class="gps-flag" hidden>GPS ready</span>
              </label>

              <label>
                <span>Date</span>
                <input id="incidentDate" name="date" type="date" required />
              </label>

              <label class="full-width">
                <span>Photo URL</span>
                <input id="photoUrl" name="photo" type="url" placeholder="https://example.com/image.jpg" />
              </label>

              <label class="full-width">
                <span>Camera / Photo Upload</span>
                <input type="file" accept="image/*" id="photoInput">
                <span id="photoStatusBadge" class="photo-flag" hidden>Photo attached</span>
              </label>
            </div>

            <div class="photo-preview" id="photoPreviewContainer" hidden></div>

            <div class="form-actions">
              <button type="submit" class="primary-button">Log Incident</button>
              <button id="clearFormButton" type="button" class="secondary-button">Clear Form</button>
            </div>
          </form>
        </section>
        </main>
      </div>

      <!-- Logs Panel -->
      <div class="tab-panel" id="logs-panel" role="tabpanel" aria-labelledby="logs-tab" hidden>
        <main class="main-grid">
        <section class="panel table-panel log-container">
          <div class="section-heading split-heading">
            <h2>Incident Log</h2>
            <div class="filters">
              <label>
                <span>Status</span>
                <select id="statusFilter">
                  <option value="all">All Statuses</option>
                  <option value="Flagged">Flagged</option>
                  <option value="Pending Trail Match">Pending Trail Match</option>
                  <option value="Reported to District">Reported to District</option>
                  <option value="Resolved">Resolved</option>
                </select>
              </label>

              <label>
                <span>Type</span>
                <select id="typeFilter">
                  <option value="all">All Types</option>
                  <option value="Trail Hazard">Trail Hazard</option>
                  <option value="Invasive Species">Invasive Species</option>
                  <option value="Infrastructure/Trash">Infrastructure/Trash</option>
                  <option value="Wildlife Impact">Wildlife Impact</option>
                </select>
              </label>
            </div>
          </div>

          <div class="table-responsive table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Type</th>
                  <th>Location</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>GPS</th>
                  <th>Date</th>
                  <th>Photo</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="incidentTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>

      <section class="panel export-panel">
        <div class="section-heading split-heading">
          <h2>Government Resume Data Exporter</h2>
          <button id="copyResumeButton" class="secondary-button" type="button">Copy Resume Bullets</button>
        </div>

        <textarea id="resumeOutput" readonly aria-label="Resume-ready incident bullet list"></textarea>
      </section>
      </main>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
