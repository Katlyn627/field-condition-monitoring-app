<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2e4a3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>East Bay Field & Trail Condition Tracker</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((error) => {
            console.error('Service worker registration failed:', error);
          });
        });
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">East Bay Regional Park Stewardship</p>
          <h1>Field & Trail Condition Tracker</h1>
        </div>
        <div class="header-actions">
          <div class="header-pill" id="offlineStatus" aria-live="polite">
            <span class="status-dot"></span>
            <span>Online</span>
          </div>
        </div>
      </header>

      <section class="dashboard" aria-label="Incident dashboard">
        <article class="stat-card total">
          <span class="stat-label">Total Logged Incidents</span>
          <strong id="totalIncidents">0</strong>
        </article>
        <article class="stat-card pending">
          <span class="stat-label">Pending Work</span>
          <strong id="pendingWork">0</strong>
        </article>
        <article class="stat-card resolved">
          <span class="stat-label">Resolved Items</span>
          <strong id="resolvedItems">0</strong>
        </article>
        <article class="stat-card hours">
          <span class="stat-label">Volunteer Hours</span>
          <strong id="volunteerHours">0.0</strong>
        </article>
      </section>

      <main class="main-grid">
        <section class="panel form-panel">
          <div class="section-heading">
            <h2>Log Field Incident</h2>
          </div>

          <form id="incidentForm">
            <div class="field-grid">
              <label>
                <span>Incident Type</span>
                <select id="incidentType" name="type" required>
                  <option value="Trail Hazard">Trail Hazard</option>
                  <option value="Invasive Species">Invasive Species</option>
                  <option value="Infrastructure/Trash">Infrastructure/Trash</option>
                  <option value="Wildlife Impact">Wildlife Impact</option>
                </select>
              </label>

              <label>
                <span>Location / Trailhead</span>
                <input id="location" name="location" type="text" placeholder="e.g., Sunset Trailhead, Tilden" required />
              </label>

              <label>
                <span>Priority Level</span>
                <select id="priority" name="priority" required>
                  <option value="Low">Low</option>
                  <option value="Medium">Medium</option>
                  <option value="High">High</option>
                  <option value="Immediate Safety Hazard">Immediate Safety Hazard</option>
                </select>
              </label>

              <label>
                <span>Status</span>
                <select id="status" name="status" required>
                  <option value="Flagged">Flagged</option>
                  <option value="Reported to District">Reported to District</option>
                  <option value="Resolved">Resolved</option>
                </select>
              </label>

              <label>
                <span>GPS Coordinates</span>
                <div class="gps-row">
                  <input id="gps" name="gps" type="text" placeholder="37.8741,-122.2861" />
                  <button id="gpsLocationButton" type="button" class="secondary-button">Use Current Location</button>
                </div>
                <span id="gpsStatusBadge" class="gps-flag" hidden>GPS ready</span>
              </label>

              <label>
                <span>Date</span>
                <input id="incidentDate" name="date" type="date" required />
              </label>

              <label class="full-width">
                <span>Photo URL</span>
                <input id="photoUrl" name="photo" type="url" placeholder="https://example.com/image.jpg" />
              </label>

              <label class="full-width">
                <span>Camera / Photo Upload</span>
                <input type="file" accept="image/*" id="photoInput">
                <span id="photoStatusBadge" class="photo-flag" hidden>Photo attached</span>
              </label>
            </div>

            <div class="photo-preview" id="photoPreviewContainer" hidden></div>

            <button type="submit" class="primary-button">Log Incident</button>
          </form>
        </section>

        <section class="panel table-panel">
          <div class="section-heading split-heading">
            <h2>Incident Log</h2>
            <div class="filters">
              <label>
                <span>Status</span>
                <select id="statusFilter">
                  <option value="all">All Statuses</option>
                  <option value="Flagged">Flagged</option>
                  <option value="Reported to District">Reported to District</option>
                  <option value="Resolved">Resolved</option>
                </select>
              </label>

              <label>
                <span>Type</span>
                <select id="typeFilter">
                  <option value="all">All Types</option>
                  <option value="Trail Hazard">Trail Hazard</option>
                  <option value="Invasive Species">Invasive Species</option>
                  <option value="Infrastructure/Trash">Infrastructure/Trash</option>
                  <option value="Wildlife Impact">Wildlife Impact</option>
                </select>
              </label>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Type</th>
                  <th>Location</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>GPS</th>
                  <th>Date</th>
                  <th>Photo</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="incidentTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>

      <section class="panel export-panel">
        <div class="section-heading split-heading">
          <h2>Government Resume Data Exporter</h2>
          <button id="copyResumeButton" class="secondary-button" type="button">Copy Resume Bullets</button>
        </div>

        <textarea id="resumeOutput" readonly aria-label="Resume-ready incident bullet list"></textarea>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
